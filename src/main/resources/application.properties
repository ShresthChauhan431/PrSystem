# =============================================================================
# Application
# =============================================================================
spring.application.name=pr-review-system
app.base-url=http://localhost:8080

# =============================================================================
# Server
# =============================================================================
server.port=8080

# =============================================================================
# DataSource (H2 In-Memory)
# =============================================================================
spring.datasource.url=jdbc:h2:file:./data/pr_review_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# =============================================================================
# H2 Console (for debugging)
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =============================================================================
# Thymeleaf
# =============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================================================
# Disable Mail Auto-Configuration (no SMTP server configured)
# =============================================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailAutoConfiguration
