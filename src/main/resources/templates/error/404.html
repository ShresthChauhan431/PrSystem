<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Not Found', ~{::main})}">
<body>
<main th:fragment="main">
    <div class="text-center py-5">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h2 class="h4 mb-3">Page Not Found</h2>
        <p class="lead text-muted mb-4" th:text="${message} ?: 'The resource you are looking for could not be found.'">
            The resource you are looking for could not be found.
        </p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-speedometer2 me-1"></i>Go to Dashboard
            </a>
            <a th:href="@{/prs}" class="btn btn-outline-primary">
                <i class="bi bi-code-slash me-1"></i>View Pull Requests
            </a>
        </div>
    </div>
</main>
</body>
</html>
