<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{fragments/layout :: layout('Admin Panel', ~{::main})}">
<body>
<main th:fragment="main">
    <h1 class="h4 mb-4"><i class="bi bi-gear me-2"></i>Admin Panel</h1>

    <!-- Stats row -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card border-primary h-100">
                <div class="card-body text-center py-3">
                    <i class="bi bi-people text-primary fs-4"></i>
                    <div class="fs-4 fw-bold mt-1" th:text="${totalUsers}">0</div>
                    <div class="small text-muted">Total Users</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card border-secondary h-100">
                <div class="card-body text-center py-3">
                    <i class="bi bi-person-badge text-secondary fs-4"></i>
                    <div class="fs-4 fw-bold mt-1" th:text="${countByRole[T(com.prreview.app.enums.Role).ADMIN]}">0</div>
                    <div class="small text-muted">Administrator</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card border-secondary h-100">
                <div class="card-body text-center py-3">
                    <i class="bi bi-person-badge text-secondary fs-4"></i>
                    <div class="fs-4 fw-bold mt-1" th:text="${countByRole[T(com.prreview.app.enums.Role).TEAM_LEAD]}">0</div>
                    <div class="small text-muted">Team Lead</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card border-secondary h-100">
                <div class="card-body text-center py-3">
                    <i class="bi bi-person-badge text-secondary fs-4"></i>
                    <div class="fs-4 fw-bold mt-1" th:text="${countByRole[T(com.prreview.app.enums.Role).REVIEWER]}">0</div>
                    <div class="small text-muted">Reviewer</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card border-secondary h-100">
                <div class="card-body text-center py-3">
                    <i class="bi bi-person-badge text-secondary fs-4"></i>
                    <div class="fs-4 fw-bold mt-1" th:text="${countByRole[T(com.prreview.app.enums.Role).DEVELOPER]}">0</div>
                    <div class="small text-muted">Developer</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Users table -->
    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h2 class="h6 mb-0"><i class="bi bi-person-lines-fill me-2"></i>Registered Users</h2>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Enabled</th>
                            <th>Created At</th>
                            <th><!-- future: disable user --></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">—</td>
                            <td th:text="${user.name}">—</td>
                            <td th:text="${user.email}">—</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${user.role.displayName}">Role</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-danger'" th:text="${user.enabled} ? 'Yes' : 'No'">—</span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">—</td>
                            <td><!-- future: disable user button --></td>
                        </tr>
                        <tr th:if="${users == null || users.isEmpty()}">
                            <td colspan="7" class="text-muted text-center py-4">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
